[project]
name = "finx-backend"
version = "0.1.0"
description = "FinX — loan agreement intelligence API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
# These modules exist to normalise confusable characters, so the confusable
# characters have to appear in them literally.
"app/parsers/lite/text.py" = ["RUF001"]
"tests/test_segmentation.py" = ["RUF001"]
